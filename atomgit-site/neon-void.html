<style>
  :root{ --cyan:#3df0ff; --magenta:#ff4df0; --gold:#ffd54a; --bg0:#05060f; --bg1:#0b1030; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:radial-gradient(120% 120% at 50% -10%, #11163a 0%, var(--bg0) 60%); }
  body{
    display:flex; align-items:center; justify-content:center;

  /* HUD */

    position:absolute; inset:0; pointer-events:none; z-index:5;

  .pill{

  .pill .label{ opacity:.7; font-weight:600; margin-right:6px; font-size:11px; }

  #hearts{ display:flex; gap:6px; }
  .heart{ width:18px; height:18px; filter:drop-shadow(0 0 6px rgba(255,77,240,.7)); }
  #muteBtn{
    pointer-events:auto; margin-left:auto; width:38px; height:38px; border-radius:12px;
    border:1px solid rgba(61,240,255,.35); background:rgba(8,14,40,.55); color:var(--cyan);
    font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }

  /* Screens */
  .screen{
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px; gap:18px;
    background:radial-gradient(120% 90% at 50% 30%, rgba(11,16,48,.78), rgba(5,6,15,.94));
    backdrop-filter:blur(3px);
  }
  .hidden{ display:none !important; }
  .logo{
    font-size:clamp(34px,9vw,52px); font-weight:900; letter-spacing:2px; line-height:1.05;
    background:linear-gradient(90deg,var(--cyan),var(--magenta));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 24px rgba(61,240,255,.25);
  }
  .subtitle{ opacity:.8; font-size:15px; max-width:340px; line-height:1.55; }
  .btn{
    pointer-events:auto; cursor:pointer; border:none;
    font-size:18px; font-weight:800; letter-spacing:1px;
    padding:14px 38px; border-radius:14px; color:#04121a;
    background:linear-gradient(90deg,var(--cyan),#8af6ff);
    box-shadow:0 8px 30px rgba(61,240,255,.4), inset 0 0 0 1px rgba(255,255,255,.4);
    transition:transform .08s ease, box-shadow .2s ease;
  }
  .btn:active{ transform:translateY(2px) scale(.98); box-shadow:0 4px 16px rgba(61,240,255,.35); }
  .btn.ghost{ background:transparent; color:var(--cyan); border:1px solid rgba(61,240,255,.5); box-shadow:none; }
  .stats{ display:flex; gap:26px; margin:4px 0 6px; }
  .stat .n{ font-size:34px; font-weight:900; color:var(--cyan); }
  .stat .t{ font-size:12px; opacity:.7; letter-spacing:1px; }
  .hint{ font-size:12px; opacity:.6; line-height:1.6; max-width:320px; }
  .badge{ font-size:13px; opacity:.85; padding:6px 12px; border-radius:999px; border:1px solid rgba(255,213,74,.4); color:var(--gold); }
  .flash{ position:absolute; inset:0; z-index:8; background:rgba(255,40,80,.0); pointer-events:none; transition:background .08s linear; }
</style>

<body>
<div id="app">
  <canvas id="game"></canvas>
  <div class="flash" id="flash"></div>

  <div id="hud" class="hidden">
    <div class="hud-row">
      <div class="pill"><span class="label">得分</span><span class="val" id="scoreVal">0</span></div>
      <div class="pill"><span class="label">金币</span><span class="val" id="coinVal">0</span></div>
    </div>
    <div class="hud-row">
      <div class="pill"><span class="label">生命</span><span id="hearts"></span></div>
      <button id="muteBtn" aria-label="静音切换">🔊</button>
    </div>
  </div>

  <!-- 开始界面 -->
  <div id="startScreen" class="screen">
    <div class="logo">NEON&nbsp;VOID</div>
    <div class="subtitle">霓虹虚空 · 驾驶霓虹战机，躲避坠落陨石、收集能量金币。生命归零即结束。</div>
    <button class="btn" id="startBtn">开始游戏</button>
    <div class="hint">
      电脑：← → 或 A / D 移动，空格暂停<br>
      手机：手指按住屏幕左右拖动战机<br>
      吃到金币 +1 分，每存活 1 秒 +1 分
    </div>
  </div>

  <!-- 结束界面 -->
  <div id="overScreen" class="screen hidden">
    <div class="logo" style="font-size:clamp(28px,7vw,40px)">任务结束</div>
    <div class="stats">
      <div class="stat"><div class="n" id="finalScore">0</div><div class="t">本局得分</div></div>
      <div class="stat"><div class="n" id="finalCoins">0</div><div class="t">收集金币</div></div>
    </div>
    <div class="badge" id="bestBadge">历史最高：0</div>
    <button class="btn" id="restartBtn">重新开始</button>
    <div class="hint">提示：陨石速度会随时间加快，优先用走位拉开距离。</div>
  </div>

<script>
(function(){
  "use strict";

  // ---------- 画布与尺寸 ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize(){
    const rect = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (player) player.y = H - 70;
  }

  // ---------- 状态 ----------
  const STATE = { START:0, PLAY:1, OVER:2 };
  let state = STATE.START;

  const player = { x:0, y:0, w:46, h:30, targetX:0, speed:9, trail:[] };
  let meteors = [];
  let coins = [];
  let stars = [];
  let particles = [];

  let score = 0, coinsGot = 0, hp = 3, maxHp = 3;
  let elapsed = 0;            // 秒
  let spawnTimer = 0;
  let lastTime = 0;
  let highScore = 0;
  let muted = false;
  let flashEl = document.getElementById('flash');
  let flashAmt = 0;

  const HS_KEY = 'neonVoidHighScore';
  try { highScore = parseInt(localStorage.getItem(HS_KEY) || '0', 10) || 0; } catch(e){ highScore = 0; }

  // ---------- 音效 (WebAudio, 无外部文件) ----------
  let actx = null;
  function initAudio(){
    if (actx) return;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; }
  }
  function beep(freq, dur, type, vol){
    if (muted || !actx) return;
    try {
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.value = vol || 0.07;
      o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime;
      o.start(t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.stop(t + dur);
    } catch(e){}
  }
  function sfxCoin(){ beep(880, 0.09, 'square', 0.06); beep(1320, 0.08, 'square', 0.04); }
  function sfxHit(){ beep(150, 0.28, 'sawtooth', 0.10); }
  function sfxOver(){ beep(220, 0.5, 'sawtooth', 0.10); beep(110, 0.6, 'sine', 0.08); }

  // ---------- 背景星空 ----------
  function initStars(){
    stars = [];
    const n = Math.round((W * H) / 7000);
    for (let i=0; i<n; i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: Math.random()*1.6 + 0.4,
        vy: Math.random()*22 + 8,
        a: Math.random()*0.6 + 0.2
      });
    }
  }

  // ---------- 工具 ----------
  function rand(a, b){ return a + Math.random()*(b-a); }
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

  function hitCircleRect(cx, cy, cr, rx, ry, rw, rh){
    const nx = clamp(cx, rx, rx+rw);
    const ny = clamp(cy, ry, ry+rh);
    const dx = cx - nx, dy = cy - ny;
    return dx*dx + dy*dy <= cr*cr;
  }

  // ---------- 生成实体 ----------
  function spawnMeteor(diff){
    const r = rand(13, 28);
    meteors.push({
      x: rand(r, W-r),
      y: -r - 4,
      r: r,
      vy: rand(120, 190) + diff*70,
      vx: rand(-0.6, 0.6),
      rot: Math.random()*Math.PI*2,
      rotSpeed: rand(-0.06, 0.06),
      hue: rand(0, 360)
    });
  }
  function spawnCoin(){
    const r = 12;
    coins.push({ x: rand(r, W-r), y: -r-4, r:r, vy: rand(140, 200), rot:0 });
  }
  function spawnParticles(x, y, color, count){
    for (let i=0; i<count; i++){
      const a = Math.random()*Math.PI*2;
      const sp = rand(1, 5);
      particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color });
    }
  }

  // ---------- 输入 ----------
  const keys = {};
  window.addEventListener('keydown', function(e){
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
    if (e.key === ' ' && state === STATE.PLAY) togglePause();
    if ((e.key === 'Enter') && state !== STATE.PLAY) startGame();
  });
  window.addEventListener('keyup', function(e){ keys[e.key] = false; });

  let pointerActive = false;
  function pointerX(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    return clamp(cx - rect.left, 0, W);
  }
  function onDown(e){ if (state === STATE.PLAY){ pointerActive = true; player.targetX = pointerX(e); } }
  function onMove(e){ if (pointerActive && state === STATE.PLAY){ player.targetX = pointerX(e); } }
  function onUp(){ pointerActive = false; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); onDown(e); }, {passive:false});
  canvas.addEventListener('touchmove', function(e){ e.preventDefault(); onMove(e); }, {passive:false});
  canvas.addEventListener('touchend', function(e){ e.preventDefault(); onUp(); }, {passive:false});

  // ---------- 游戏控制 ----------
  let paused = false;
  function togglePause(){
    paused = !paused;
    flashEl.style.background = paused ? 'rgba(61,240,255,.06)' : 'rgba(255,40,80,0)';
  }

  function resetGame(){
    meteors = []; coins = []; particles = [];
    score = 0; coinsGot = 0; hp = maxHp; elapsed = 0;
    spawnTimer = 0; paused = false; flashAmt = 0;
    player.x = W/2; player.y = H - 70; player.targetX = W/2; player.trail = [];
    flashEl.style.background = 'rgba(255,40,80,0)';
    updateHud();
  }

  function startGame(){
    initAudio();
    if (actx && actx.state === 'suspended') actx.resume();
    resetGame();
    state = STATE.PLAY;
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('overScreen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    lastTime = performance.now();
  }

  function endGame(){
    state = STATE.OVER;
    sfxOver();
    if (score > highScore){
      highScore = score;
      try { localStorage.setItem(HS_KEY, String(highScore)); } catch(e){}
    }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalCoins').textContent = coinsGot;
    document.getElementById('bestBadge').textContent = '历史最高：' + highScore;
    document.getElementById('overScreen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
  }

  // ---------- 更新 ----------
  function update(dt){
    elapsed += dt;

    // 难度系数：随时间提升，封顶 3
    const diff = Math.min(1 + elapsed/28, 3);

    // 星空滚动
    for (const s of stars){
      s.y += s.vy * dt;
      if (s.y > H + 2){ s.y = -2; s.x = Math.random()*W; }
    }

    // 玩家移动（键盘 + 指针目标）
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.targetX -= player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.targetX += player.speed;
    player.targetX = clamp(player.targetX, player.w/2, W - player.w/2);
    player.x += (player.targetX - player.x) * Math.min(1, dt*14);
    player.x = clamp(player.x, player.w/2, W - player.w/2);

    // 尾迹
    player.trail.push({ x:player.x, y:player.y });
    if (player.trail.length > 10) player.trail.shift();

    // 存活得分
    score += dt; // 每秒 +1

    // 生成
    spawnTimer -= dt*1000;
    if (spawnTimer <= 0){
      spawnMeteor(diff);
      if (Math.random() < 0.45) spawnMeteor(diff); // 偶尔双发
      if (Math.random() < 0.5) spawnCoin();
      spawnTimer = Math.max(280, 820 - elapsed*14);
    }

    const pr = { x:player.x - player.w/2, y:player.y - player.h/2, w:player.w, h:player.h };

    // 陨石
    for (let i=meteors.length-1; i>=0; i--){
      const m = meteors[i];
      m.y += m.vy * dt;   // vy 单位：像素/秒
      m.x += m.vx;
      m.rot += m.rotSpeed;
      if (m.x < m.r || m.x > W - m.r) m.vx *= -1;
      if (hitCircleRect(m.x, m.y, m.r, pr.x, pr.y, pr.w, pr.h)){
        meteors.splice(i,1);
        hp -= 1;
        sfxHit();
        flashAmt = 1;
        spawnParticles(m.x, m.y, '#ff4d6d', 16);
        updateHud();
        if (hp <= 0){ endGame(); return; }
        continue;
      }
      if (m.y - m.r > H){ meteors.splice(i,1); }
    }

    // 金币
    for (let i=coins.length-1; i>=0; i--){
      const c = coins[i];
      c.y += c.vy;
      c.rot += dt*4;
      if (hitCircleRect(c.x, c.y, c.r, pr.x, pr.y, pr.w, pr.h)){
        coins.splice(i,1);
        coinsGot += 1;
        score += 1; // 金币 +1
        sfxCoin();
        spawnParticles(c.x, c.y, '#ffd54a', 12);
        updateHud();
        continue;
      }
      if (c.y - c.r > H){ coins.splice(i,1); }
    }

    // 粒子
    for (let i=particles.length-1; i>=0; i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= dt*1.6;
      if (p.life <= 0) particles.splice(i,1);
    }

    // 闪屏衰减
    if (flashAmt > 0){ flashAmt = Math.max(0, flashAmt - dt*3); }
    flashEl.style.background = 'rgba(255,40,80,' + (flashAmt*0.35).toFixed(3) + ')';
  }

  // ---------- 绘制 ----------
  function drawShip(){
    const x = player.x, y = player.y;
    // 尾迹
    for (let i=0; i<player.trail.length; i++){
      const t = player.trail[i];
      const a = (i/player.trail.length) * 0.5;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(61,240,255,' + a.toFixed(3) + ')';
      ctx.arc(t.x, t.y + 14, 3 + i*0.4, 0, Math.PI*2);
      ctx.fill();
    }
    // 机身光晕
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = 'rgba(61,240,255,.9)';
    ctx.shadowBlur = 18;
    const g = ctx.createLinearGradient(0,-16,0,16);
    g.addColorStop(0,'#aef6ff'); g.addColorStop(1,'#1aa6c4');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0,-16);
    ctx.lineTo(13,14);
    ctx.lineTo(0,7);
    ctx.lineTo(-13,14);
    ctx.closePath();
    ctx.fill();
    // 驾驶舱
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,77,240,.9)';
    ctx.beginPath(); ctx.arc(0,-4,3.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawMeteor(m){
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    ctx.shadowColor = 'rgba(255,90,60,.7)';
    ctx.shadowBlur = 14;
    const g = ctx.createRadialGradient(-m.r*0.3,-m.r*0.3, m.r*0.2, 0,0, m.r);
    g.addColorStop(0,'#ff9a6b'); g.addColorStop(0.6,'#c43b2a'); g.addColorStop(1,'#5e150f');
    ctx.fillStyle = g;
    ctx.beginPath();
    const pts = 8;
    for (let i=0; i<pts; i++){
      const a = (i/pts)*Math.PI*2;
      const rr = m.r * (0.82 + 0.18*Math.sin(i*2.3));
      const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
      i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawCoin(c){
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(Math.sin(c.rot)*0.5);
    ctx.shadowColor = 'rgba(255,213,74,.9)';
    ctx.shadowBlur = 16;
    const g = ctx.createRadialGradient(-4,-4,2,0,0,c.r);
    g.addColorStop(0,'#fff3c4'); g.addColorStop(0.5,'#ffd54a'); g.addColorStop(1,'#b8860b');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,c.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(120,80,0,.9)';
    ctx.font = 'bold ' + (c.r*1.1).toFixed(0) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('◆', 0, 1);
    ctx.restore();
  }

  function render(){
    ctx.clearRect(0,0,W,H);

    // 背景渐变
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#070a1c'); bg.addColorStop(0.6,'#0a0f2e'); bg.addColorStop(1,'#05060f');
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

    // 星星
    for (const s of stars){
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#bfe9ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 实体
    for (const c of coins) drawCoin(c);
    for (const m of meteors) drawMeteor(m);
    drawShip();

    // 粒子
    for (const p of particles){
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (paused && state === STATE.PLAY){
      ctx.fillStyle = 'rgba(5,6,15,.55)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#3df0ff';
      ctx.font = 'bold 30px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('已暂停', W/2, H/2);
      ctx.font = '14px sans-serif'; ctx.fillStyle = 'rgba(232,243,255,.7)';
      ctx.fillText('按空格继续', W/2, H/2 + 34);
    }
  }

  // ---------- HUD ----------
  const scoreVal = document.getElementById('scoreVal');
  const coinVal = document.getElementById('coinVal');
  const heartsEl = document.getElementById('hearts');
  const HEART_SVG = '<svg class="heart" viewBox="0 0 24 24"><path fill="#ff4d6d" d="M12 21s-7.5-4.6-10-9.2C.6 8.9 2 5.5 5.2 5.1 7 4.9 8.6 5.9 9.4 7.2 10.2 5.9 11.8 4.9 13.6 5.1 16.8 5.5 18.2 8.9 16.8 11.8 14.3 16.4 12 21 12 21z"/></svg>';
  function updateHud(){
    scoreVal.textContent = Math.floor(score);
    coinVal.textContent = coinsGot;
    let h = '';
    for (let i=0; i<maxHp; i++) h += HEART_SVG;
    heartsEl.innerHTML = h;
    // 失去的心用暗色
    const nodes = heartsEl.querySelectorAll('.heart path');
    for (let i=0; i<nodes.length; i++){
      nodes[i].setAttribute('fill', i < hp ? '#ff4d6d' : 'rgba(255,77,109,.18)');
    }
  }

  // ---------- 主循环 ----------
  function loop(now){
    requestAnimationFrame(loop);
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.05) dt = 0.05; // 防止切后台后跳跃
    if (state === STATE.PLAY && !paused){
      update(dt);
    } else if (state === STATE.START){
      // 仅滚动星空
      for (const s of stars){ s.y += s.vy*dt; if (s.y>H+2){ s.y=-2; s.x=Math.random()*W; } }
    }
    render();
  }

  // ---------- 按钮 ----------
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  document.getElementById('muteBtn').addEventListener('click', function(){
    muted = !muted;
    this.textContent = muted ? '🔇' : '🔊';
  });

  // ---------- 初始化 ----------
  window.addEventListener('resize', function(){ resize(); initStars(); });
  resize();
  initStars();
  updateHud();
  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
