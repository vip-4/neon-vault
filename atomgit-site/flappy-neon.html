  .btn:active{ transform:translateY(2px) scale(.98); }
  .stats{ display:flex; gap:26px; margin:4px 0 6px; }
  .stat .n{ font-size:34px; font-weight:900; color:#3df0ff; }
  .stat .t{ font-size:12px; opacity:.7; letter-spacing:1px; }
  .badge{ font-size:13px; opacity:.9; padding:6px 14px; border-radius:999px; border:1px solid rgba(255,213,74,.4); color:#ffd54a; }
  .hint{ font-size:12px; opacity:.6; line-height:1.7; max-width:300px; }

<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="startScreen" class="screen">
    <div class="logo">NEON&nbsp;FLAPPY</div>
    <div class="subtitle">霓虹飞鸟 · 点击屏幕或按空格让小鸟振翅，穿过霓虹管道，别撞上去！</div>
    <button class="btn" id="startBtn">开始游戏</button>
    <div class="hint">电脑：空格 / 点击 跳跃<br>手机：点击屏幕 跳跃</div>
  </div>

  <div id="overScreen" class="screen hidden">
    <div class="logo" style="font-size:clamp(26px,7vw,38px)">GAME OVER</div>
    <div class="stats">
      <div class="stat"><div class="n" id="finalScore">0</div><div class="t">本局得分</div></div>
      <div class="stat"><div class="n" id="finalBest">0</div><div class="t">最高分</div></div>
    </div>
    <div class="badge" id="bestBadge">历史最高：0</div>
    <button class="btn" id="restartBtn">重新开始</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize(){
    const rect = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  const STATE = { START:0, PLAY:1, OVER:2 };
  let state = STATE.START;

  // 物理参数（像素 / 秒）
  const GRAVITY = 1500;      // 重力加速度
  const FLAP_V  = -430;      // 振翅瞬时速度
  const PIPE_SPEED = 165;    // 管道水平速度
  const PIPE_GAP = 168;      // 上下管道间隙
  const PIPE_W = 64;
  const PIPE_INTERVAL = 1.45;// 生成间隔（秒）
  const GROUND_H = 64;

  const bird = { x:0, y:0, r:15, vy:0, rot:0 };
  let pipes = [];
  let stars = [];
  let particles = [];
  let score = 0, best = 0, spawnTimer = 0, groundX = 0, flashAmt = 0;
  let lastTime = 0;

  const HS_KEY = 'neonFlappyBest';
  try { best = parseInt(localStorage.getItem(HS_KEY) || '0', 10) || 0; } catch(e){ best = 0; }

  const flashEl = document.createElement('div');
  flashEl.style.cssText = 'position:absolute;inset:0;z-index:8;pointer-events:none;background:rgba(255,40,80,0);';
  document.getElementById('app').appendChild(flashEl);

  function rand(a,b){ return a + Math.random()*(b-a); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  function initStars(){
    stars = [];
    const n = Math.round((W*H)/6000);
    for (let i=0;i<n;i++){
      stars.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.5+0.3, vy:Math.random()*18+6, a:Math.random()*0.6+0.2 });
    }
  }

  function resetGame(){
    pipes = []; particles = [];
    score = 0; spawnTimer = 0; flashAmt = 0; groundX = 0;
    bird.x = W*0.30; bird.y = H*0.42; bird.vy = 0; bird.rot = 0;
  }

  function flap(){
    if (state === STATE.START){ startGame(); return; }
    if (state === STATE.OVER) return;
    bird.vy = FLAP_V;
    spawnParticles(bird.x, bird.y, '#3df0ff', 5);
  }

  function startGame(){
    resetGame();
    state = STATE.PLAY;
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('overScreen').classList.add('hidden');
    lastTime = performance.now();
  }

  function gameOver(){
    state = STATE.OVER;
    if (score > best){
      best = score;
      try { localStorage.setItem(HS_KEY, String(best)); } catch(e){}
    }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = best;
    document.getElementById('bestBadge').textContent = '历史最高：' + best;
    document.getElementById('overScreen').classList.remove('hidden');
    spawnParticles(bird.x, bird.y, '#ff4d6d', 22);
    flashAmt = 1;
  }

  function spawnParticles(x,y,color,count){
    for (let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2, sp = rand(1,5);
      particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color });
    }
  }

  function spawnPipe(){
    const margin = 70;
    const minTop = margin;
    const maxTop = H - GROUND_H - PIPE_GAP - margin;
    const topH = rand(minTop, maxTop);
    pipes.push({ x:W, top:topH, scored:false });
  }

  function update(dt){
    // 小鸟物理
    bird.vy += GRAVITY * dt;
    bird.y  += bird.vy * dt;
    bird.rot = clamp(bird.vy / 600, -0.5, 1.3);

    // 地面与天花板
    if (bird.y + bird.r >= H - GROUND_H){ bird.y = H - GROUND_H - bird.r; gameOver(); return; }
    if (bird.y - bird.r <= 0){ bird.y = bird.r; bird.vy = 0; }

    // 管道
    spawnTimer -= dt;
    if (spawnTimer <= 0){ spawnPipe(); spawnTimer = PIPE_INTERVAL; }

    for (let i=pipes.length-1; i>=0; i--){
      const p = pipes[i];
      p.x -= PIPE_SPEED * dt;

      // 计分：小鸟越过管道中心
      if (!p.scored && p.x + PIPE_W < bird.x){
        p.scored = true; score += 1;
      }

      // 碰撞检测（圆 vs 矩形，上下管道）
      const inX = (bird.x + bird.r > p.x) && (bird.x - bird.r < p.x + PIPE_W);
      if (inX){
        const gapTop = p.top, gapBot = p.top + PIPE_GAP;
        if (bird.y - bird.r < gapTop || bird.y + bird.r > gapBot){
          gameOver(); return;
        }
      }
      if (p.x + PIPE_W < -10) pipes.splice(i,1);
    }

    // 地面滚动
    groundX = (groundX - PIPE_SPEED * dt) % 40;

    // 粒子
    for (let i=particles.length-1;i>=0;i--){
      const pt = particles[i];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.12; pt.life -= dt*1.6;
      if (pt.life <= 0) particles.splice(i,1);
    }

    if (flashAmt > 0) flashAmt = Math.max(0, flashAmt - dt*3);
    flashEl.style.background = 'rgba(255,40,80,' + (flashAmt*0.35).toFixed(3) + ')';
  }

  // ---------- 绘制 ----------
  function drawBackground(){
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0a1330'); bg.addColorStop(0.6,'#0a0f2e'); bg.addColorStop(1,'#05060f');
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
    for (const s of stars){
      s.y += s.vy*0.016; if (s.y>H+2){ s.y=-2; s.x=Math.random()*W; }
      ctx.globalAlpha = s.a; ctx.fillStyle = '#bfe9ff';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPipe(p){
    const gapBot = p.top + PIPE_GAP;
    const grad = ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
    grad.addColorStop(0,'#1c8f6e'); grad.addColorStop(0.5,'#39f0c0'); grad.addColorStop(1,'#1c8f6e');
    ctx.fillStyle = grad;
    ctx.shadowColor = 'rgba(57,240,192,.6)'; ctx.shadowBlur = 14;
    // 上管道
    ctx.fillRect(p.x, 0, PIPE_W, p.top);
    ctx.fillRect(p.x-4, p.top-18, PIPE_W+8, 18); // 上管口
    // 下管道
    ctx.fillRect(p.x, gapBot, PIPE_W, H-GROUND_H-gapBot);
    ctx.fillRect(p.x-4, gapBot, PIPE_W+8, 18); // 下管口
    ctx.shadowBlur = 0;
  }

  function drawBird(){
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    ctx.shadowColor = 'rgba(61,240,255,.9)'; ctx.shadowBlur = 16;
    const g = ctx.createRadialGradient(-4,-4,2,0,0,bird.r);
    g.addColorStop(0,'#aef6ff'); g.addColorStop(1,'#1aa6c4');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,bird.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // 眼睛
    ctx.fillStyle = '#04121a';
    ctx.beginPath(); ctx.arc(6,-4,3,0,Math.PI*2); ctx.fill();
    // 翅膀
    ctx.fillStyle = 'rgba(255,77,240,.85)';
    ctx.beginPath(); ctx.ellipse(-6,2,6,3.5,bird.rot,0,Math.PI*2); ctx.fill();
    // 喙
    ctx.fillStyle = '#ffd54a';
    ctx.beginPath(); ctx.moveTo(bird.r-2,-1); ctx.lineTo(bird.r+7,2); ctx.lineTo(bird.r-2,5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawGround(){
    ctx.fillStyle = '#0c1733';
    ctx.fillRect(0, H-GROUND_H, W, GROUND_H);
    ctx.strokeStyle = 'rgba(61,240,255,.5)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0,H-GROUND_H); ctx.lineTo(W,H-GROUND_H); ctx.stroke();
    ctx.strokeStyle = 'rgba(61,240,255,.18)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x=groundX; x<W; x+=40){ ctx.moveTo(x,H-14); ctx.lineTo(x+20,H-14); }
    ctx.stroke();
  }

  function drawScore(){
    ctx.fillStyle = '#e8f3ff';
    ctx.font = 'bold 44px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.shadowColor = 'rgba(61,240,255,.8)'; ctx.shadowBlur = 12;
    ctx.fillText(String(score), W/2, 22);
    ctx.shadowBlur = 0;
  }

  function render(){
    drawBackground();
    for (const p of pipes) drawPipe(p);
    drawGround();
    drawBird();
    for (const pt of particles){
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,2.4,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (state === STATE.PLAY) drawScore();
  }

  // ---------- 主循环 ----------
  function loop(now){
    requestAnimationFrame(loop);
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.05) dt = 0.05;
    if (state === STATE.PLAY) update(dt);
    else if (state === STATE.START){
      for (const s of stars){ s.y += s.vy*dt; if (s.y>H+2){ s.y=-2; s.x=Math.random()*W; } }
    }
    render();
  }

  // ---------- 输入 ----------
  function onTap(e){ e.preventDefault(); flap(); }
  canvas.addEventListener('pointerdown', onTap);
  canvas.addEventListener('touchstart', onTap, {passive:false});
  window.addEventListener('keydown', function(e){
    if (e.code === 'Space' || e.key === ' '){ e.preventDefault(); flap(); }
    if (e.key === 'Enter' && state !== STATE.PLAY) startGame();
  });
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  // ---------- 启动 ----------
  window.addEventListener('resize', function(){ resize(); initStars(); });
  resize(); initStars(); lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
