  function continueAfterVictory() {
    if (game.phase !== 'victory') return;
    game.phase = 'idle';
    game.overlay = null;
    game.confettiClock = 0;
    sfx('click');
  }

  function toggleMute() {
    game.muted = !game.muted;
    if (!game.muted) {
      ensureAudio();
      sfx('toggle');
    }
    ui.pressedId = null;
  }

  function openPaytable() {
    if (game.overlay) return;
    if (game.phase !== 'menu' && game.phase !== 'idle') return;
    game.overlay = 'paytable';
    ensureAudio();
    sfx('click');
  }

  function closePaytable() {
    game.overlay = null;
    ensureAudio();
    sfx('click');
  }

  function togglePaytable() {
    if (game.overlay === 'paytable') closePaytable();
    else openPaytable();
  }

  // 生成中奖结果（从最左侧滚轮开始连续匹配）
  function evaluateWins() {
    const grid = game.grid;
    const wins = [];
    for (let li = 0; li < PAYLINES.length; li++) {
      const line = PAYLINES[li];
      const target = grid[0][line[0]];
      let count = 1;
      for (let col = 1; col < REEL_COUNT; col++) {
        if (grid[col][line[col]] === target) count++;
        else break;
      }
      if (count >= 3) {
        const mult = SYMBOLS[target].mult[count];
        const amount = Math.max(1, Math.round(game.bet * mult));
        wins.push({
          lineIndex: li,
          line,
          symbol: target,
          count,
          mult,
          amount,
          cells: line.slice(0, count).map((row, col) => [col, row])
        });
      }
    }
    return wins;
  }

  // 检查是否前 n 个滚轮出现同符号连线（用于制造悬念停顿）
  function hasPrefix(n) {
    return PAYLINES.some((line) => {
      const sym = game.grid[0][line[0]];
      for (let c = 1; c < n; c++) {
        if (game.grid[c][line[c]] !== sym) return false;
      }
      return true;
    });
  }

  function startSpin() {
    if (game.phase !== 'idle' || game.overlay) return;
    if (game.credits < game.bet) {
      clampBetToCredits();
      if (game.credits < game.bet) return;
    }
    ensureAudio();
    const now = nowSec();

    game.credits -= game.bet;
    game.spins += 1;
    game.wagered += game.bet;
    game.lastWin = 0;
    game.displayWin = 0;
    game.winTier = 0;
    game.winLines = [];
    game.anticipation = 0;
    game.shake = 0;
    game.allStoppedAt = 0;
    game.phase = 'spinning';
    game.spinStart = now;

    // 先决定最终结果（每个滚轮 3 个可见符号）
    game.grid = Array.from({ length: REEL_COUNT }, () =>
      Array.from({ length: ROWS }, () => pickSymbolIndex())
    );

    reels.forEach((r, i) => {
      r.mode = 'spinning';
      r.speed = rand(14, 20);
      r.stopAt = now + 0.9 + i * 0.7;
      r.t0 = 0;
      r.flash = 0;
      r.targetIndex = 0;
    });
    ui.pressedId = null;
    sfx('spin');
  }

  function startReelStop(reel, index, now) {
    // 让滚轮在当前位置之后约 9~11 个符号处停住，落点必须是整数
    const gap = 9 + index * 0.55;
    const to = Math.ceil(reel.pos - gap);
    const t = mod(to, REEL_LEN);
    for (let row = 0; row < ROWS; row++) {
      reel.strip[mod(t + row, REEL_LEN)] = game.grid[index][row];
    }
    reel.targetIndex = t;
    reel.from = reel.pos;
    reel.to = to;
    reel.t0 = now;
    reel.dur = 0.58 + index * 0.012;
    reel.mode = 'stopping';
  }

  function onReelLanded(index, now) {
    game.shake = Math.max(game.shake, 1.6);
    sfx('stop');
    reels[index].flash = now;

    // 第三个滚轮落定：若前三个符号一致，剩余滚轮延长悬念
    if (index === 2 && hasPrefix(3)) {
      game.anticipation = 1;
      for (let j = 3; j < REEL_COUNT; j++) {
        if (reels[j].mode === 'spinning') reels[j].stopAt += 0.55;
      }
      sfx('riser');
    }
    // 第四个滚轮落定：若前四个一致，最后一轮再拖长一点
    if (index === 3 && hasPrefix(4)) {
      game.anticipation = 2;
      const last = reels[4];
      if (last.mode === 'spinning') {
        last.stopAt = Math.max(last.stopAt, now + 0.7);
      }
      sfx('riser');
    }
  }

  function updateReels(dt, now) {
    if (game.phase !== 'spinning') return;
    let allStopped = true;

    for (let i = 0; i < REEL_COUNT; i++) {
      const r = reels[i];
      if (r.mode === 'spinning') {
        allStopped = false;
        const targetSpeed = 24 + i * 1.1;
        r.speed = lerp(r.speed || targetSpeed, targetSpeed, 1 - Math.exp(-dt * 11));
        r.pos -= r.speed * dt;
        if (now >= r.stopAt) {
          startReelStop(r, i, now);
        }
      } else if (r.mode === 'stopping') {
        allStopped = false;
        const k = clamp((now - r.t0) / r.dur, 0, 1);
        const prev = r.pos;
        r.pos = lerp(r.from, r.to, easeOutCubic(k));
        r.speed = Math.abs(r.pos - prev) / Math.max(dt, 0.001);
        if (k >= 1) {
          r.pos = r.to;
          r.speed = 0;
          r.mode = 'stopped';
          onReelLanded(i, now);
        }
      }
    }

    if (allStopped) {
      if (!game.allStoppedAt) game.allStoppedAt = now;
      if (now - game.allStoppedAt >= 0.38) resolveSpin(now);
    } else {
      game.allStoppedAt = 0;
    }
  }

  function resolveSpin(now) {
    if (game.phase !== 'spinning') return;
    const wins = evaluateWins();
    const total = wins.reduce((sum, w) => sum + w.amount, 0);
    game.winLines = wins;
    game.lastWin = total;
    game.displayWin = 0;
    game.anticipation = 0;

    if (total > 0) {
      game.credits += total;
      game.totalWon += total;
      game.wins += 1;
      game.bestWin = Math.max(game.bestWin, total);
      game.peak = Math.max(game.peak, game.credits);
      const mult = total / game.bet;
      game.winTier = mult >= 80 ? 4 : mult >= 25 ? 3 : mult >= 10 ? 2 : 1;
      game.shake = game.winTier >= 3 ? 9 : game.winTier === 2 ? 6 : 3.2;
      spawnWinConfetti(game.winTier);
      sfx(game.winTier >= 4 ? 'jackpot' : game.winTier >= 2 ? 'bigwin' : 'win');
    } else {
      game.winTier = 0;
    }

    game.phase = 'resolving';
    game.resolveStart = now;
    game.resolveDur = total > 0
      ? (game.winTier >= 4 ? 3.6 : game.winTier >= 3 ? 3.1 : game.winTier === 2 ? 2.6 : 2.0)
      : 1.15;
    game.resolveElapsed = 0;
    game.allStoppedAt = 0;
  }

  function finishResolve() {
    if (game.phase !== 'resolving') return;
    game.displayWin = game.lastWin;
    clampBetToCredits();

    if (game.credits < MIN_BET) {
      game.phase = 'gameover';
      saveHighScore();
      sfx('gameover');
      return;
    }
    if (game.credits >= GOAL && !game.wonOnce) {
      game.phase = 'victory';
      game.wonOnce = true;
      saveHighScore();
      spawnVictoryRain(160);
      game.confettiClock = 0.35;
      sfx('victory');
      return;
    }
    game.phase = 'idle';
  }

  /* ============================================================
     十七、粒子与礼花
     ============================================================ */
  function randomCandyColor() {
    const palette = [C.cyan, C.magenta, C.gold, C.green, C.purple, '#ffffff'];
    return palette[randi(0, palette.length - 1)];
  }

  function spawnWinConfetti(tier) {
    const g = L.grid;
    const cx = g ? g.x + g.w / 2 : W / 2;
    const cy = g ? g.y + g.h * 0.35 : H / 2;
    const count = tier >= 4 ? 170 : tier >= 3 ? 110 : tier >= 2 ? 64 : 26;
    for (let i = 0; i < count; i++) {
      const angle = rand(Math.PI * 1.08, Math.PI * 1.92);
      const speed = rand(120, 460);
      const life = rand(1.1, 2.4);
      confetti.push({
        x: cx + rand(-g.w * 0.24, g.w * 0.24),
        y: cy + rand(-20, 20),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed * 0.9,
        g: rand(420, 760),
        size: rand(3, 8),
        life,
        maxLife: life,
        rot: rand(0, TAU),
        vr: rand(-10, 10),
        color: randomCandyColor(),
        shape: Math.random() < 0.5 ? 0 : 1
      });
    }
    if (confetti.length > 480) confetti.splice(0, confetti.length - 480);
  }

  function spawnVictoryRain(count) {
    for (let i = 0; i < count; i++) {
      const life = rand(2.4, 4.8);
      confetti.push({
        x: rand(-20, W + 20),
        y: rand(-H * 0.35, -10),
        vx: rand(-40, 40),
        vy: rand(50, 150),
        g: rand(4, 50),
        size: rand(3, 9),
        life,
        maxLife: life,
        rot: rand(0, TAU),
        vr: rand(-7, 7),
        color: randomCandyColor(),
        shape: Math.random() < 0.5 ? 0 : 1
      });
    }
    if (confetti.length > 560) confetti.splice(0, confetti.length - 560);
  }

  function updateConfetti(dt) {
    for (const p of confetti) {
      p.life -= dt;
      p.vy += p.g * dt;
      p.vx *= (1 - 0.7 * dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    confetti = confetti.filter((p) => p.life > 0 && p.y < H + 60);
  }

  function drawConfettiParticles() {
    if (!confetti.length) return;
    ctx.save();
    for (const p of confetti) {
      const a = clamp(p.life / p.maxLife * 1.6, 0, 0.95);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      if (p.shape === 0) {
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.35, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  /* ============================================================
     十八、主循环更新 / 覆盖层 / 后处理
     ============================================================ */
  function update(dt, now) {
    // 信用点数字滚动
    const diff = game.credits - game.displayCredits;
    if (Math.abs(diff) < 0.6) {
      game.displayCredits = game.credits;
    } else {
      game.displayCredits += diff * clamp(dt * 8, 0, 1);
    }

    if (game.phase === 'spinning') {
      updateReels(dt, now);
    }

    if (game.phase === 'resolving') {
      game.resolveElapsed = now - game.resolveStart;
      if (game.lastWin > 0) {
        game.displayWin = game.lastWin * easeOutCubic(clamp(game.resolveElapsed / 0.8, 0, 1));
      } else {
        game.displayWin = 0;
      }
      if (game.resolveElapsed >= game.resolveDur) finishResolve();
    }

    if (game.phase === 'idle') {
      game.displayWin = game.lastWin;
    }

    if (game.phase === 'victory') {
      game.confettiClock -= dt;
      if (game.confettiClock <= 0) {
        game.confettiClock = 0.42;
        spawnVictoryRain(16);
      }
    }

    game.shake = Math.max(0, game.shake - dt * 22);
    updateConfetti(dt);
    updateAmbient(dt);
  }

  function drawScanlines(t) {
    if (!scene) return;
    if (!drawScanlines.pattern) {
      const cv = document.createElement('canvas');
      cv.width = 4; cv.height = 4;
      const g = cv.getContext('2d');
      g.fillStyle = 'rgba(190,240,255,0.055)';
      g.fillRect(0, 0, 4, 1);
      g.fillStyle = 'rgba(0,0,0,0.035)';
      g.fillRect(0, 2, 4, 1);
      drawScanlines.pattern = ctx.createPattern(cv, 'repeat');
    }
    ctx.save();
    ctx.fillStyle = drawScanlines.pattern;
    ctx.fillRect(0, 0, W, H);

    // 缓慢扫过屏幕的光带
    const bandY = ((t * 55) % (H + 240)) - 120;
    const band = ctx.createLinearGradient(0, bandY, 0, bandY + 80);
    band.addColorStop(0, 'rgba(49,234,255,0)');
    band.addColorStop(0.5, 'rgba(49,234,255,0.028)');
    band.addColorStop(1, 'rgba(255,43,214,0)');
    ctx.fillStyle = band;
    ctx.fillRect(0, bandY, W, 80);
    ctx.restore();
  }

  function drawVignette() {
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.78);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(0.62, 'rgba(0,0,0,0.14)');
    v.addColorStop(1, 'rgba(0,0,0,0.62)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  function render(now) {
    const t = now;
    buttons = [];

    drawBackground(t);

    if (game.phase === 'menu') {
      drawMenu(t);
    } else {
      drawHeader(t);
      if (!L.landscape) drawProgressBlock(L.progress, t);
      drawSlotFrame(t);
      drawWinBanner(t);
      if (L.landscape) {
        drawSidePanel(t);
      } else {
        drawControlsPortrait(t);
        drawStatsStrip(t);
      }
      drawFooter(t);

      if (game.phase === 'gameover') drawGameOver(t);
      else if (game.phase === 'victory') drawVictory(t);
    }

    if (game.overlay === 'paytable') drawPaytable(t);

    drawConfettiParticles();
    drawScanlines(t);
    drawVignette();
  }

  /* ============================================================
     十九、输入处理（Pointer / Touch / Keyboard）
     ============================================================ */
  function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = rect.width ? W / rect.width : 1;
    const sy = rect.height ? H / rect.height : 1;
    return {
      x: (e.clientX - rect.left) * sx,
      y: (e.clientY - rect.top) * sy
    };
  }

  function hitTestAt(x, y) {
    for (let i = buttons.length - 1; i >= 0; i--) {
      const b = buttons[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
    }
    return null;
  }

  let dragStart = null;

  function handlePrimaryAction() {
    if (game.overlay === 'paytable') { closePaytable(); return; }
    if (game.phase === 'menu') startGame();
    else if (game.phase === 'idle') startSpin();
    else if (game.phase === 'gameover') startGame();
    else if (game.phase === 'victory') continueAfterVictory();
  }

  function setupInput() {
    canvas.addEventListener('pointerdown', (e) => {
      if (e.cancelable) e.preventDefault();
      ensureAudio();
      const p = getPointerPos(e);
      ui.pointer = p;
      ui.isDown = true;
      const hit = hitTestAt(p.x, p.y);
      ui.pressedId = hit ? hit.id : null;
      dragStart = { x: p.x, y: p.y, t: nowSec(), onButton: !!hit };
      if (hit) {
        try { hit.fn(); } catch (err) { console.error(err); }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      const p = getPointerPos(e);
      ui.pointer = p;
      if (e.pointerType === 'mouse') {
        const hit = hitTestAt(p.x, p.y);
        canvas.style.cursor = hit ? 'pointer' : 'default';
      }
    });

    const releasePointer = (e) => {
      if (e && e.cancelable) e.preventDefault();
      const p = getPointerPos(e);
      ui.pointer = p;
      ui.isDown = false;

      // 触摸/点击滚轮区域也可以旋转，向上滑动同样触发
      if (dragStart && !dragStart.onButton && !game.overlay && game.phase === 'idle' && L.frame) {
        const dx = p.x - dragStart.x;
        const dy = p.y - dragStart.y;
        const dist = Math.hypot(dx, dy);
        const inFrame = inRect(dragStart.x, dragStart.y, L.frame.x, L.frame.y, L.frame.w, L.frame.h);
        if (inFrame && (dist < 16 || dy < -42)) {
          startSpin();
        }
      }
      dragStart = null;
      ui.pressedId = null;
    };

    canvas.addEventListener('pointerup', releasePointer);
    canvas.addEventListener('pointercancel', () => {
      ui.isDown = false;
      ui.pressedId = null;
      dragStart = null;
    });
    canvas.addEventListener('pointerleave', () => {
      ui.pointer = { x: -9999, y: -9999 };
      ui.pressedId = null;
      canvas.style.cursor = 'default';
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // 显式阻止移动端滚动/缩放（Pointer Events 已负责主要交互）
    canvas.addEventListener('touchstart', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });

    window.addEventListener('keydown', (e) => {
      const code = e.code;
      if (['Space', 'ArrowLeft', 'ArrowRight', 'Enter', 'Escape'].includes(code)) {
        e.preventDefault();
      }
      if (e.repeat) return;
      ensureAudio();

      if (code === 'KeyM') { toggleMute(); return; }
      if (code === 'KeyP') { togglePaytable(); return; }

      if (game.overlay === 'paytable') {
        if (code === 'Escape' || code === 'Space' || code === 'Enter') closePaytable();
        return;
      }

      if (game.phase === 'menu') {
        if (code === 'Space' || code === 'Enter') startGame();
        return;
      }

      if (game.phase === 'idle') {
        if (code === 'Space' || code === 'Enter') startSpin();
        else if (code === 'ArrowLeft') changeBet(-1);
        else if (code === 'ArrowRight') changeBet(1);
        return;
      }

      if (game.phase === 'gameover') {
        if (code === 'Space' || code === 'Enter') startGame();
        else if (code === 'Escape') toMenu();
        return;
      }

      if (game.phase === 'victory') {
        if (code === 'Space' || code === 'Enter') continueAfterVictory();
        else if (code === 'Escape') startGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      // 键盘抬起时清除按压态，保持按钮视觉反馈完整
      if (e.code === 'Space' || e.code === 'Enter') ui.pressedId = null;
    });

    window.addEventListener('blur', () => {
      ui.isDown = false;
      ui.pressedId = null;
      dragStart = null;
    });
  }

  /* ============================================================
     二十、启动
     ============================================================ */
  let resizeTimer = 0;
  function setupResize() {
    const schedule = () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        ui.pointer = { x: -9999, y: -9999 };
        resizeCanvas();
        if (game.phase !== 'menu') drawFrameAfterResize();
      }, 120);
    };
    window.addEventListener('resize', schedule);
    window.addEventListener('orientationchange', schedule);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', schedule);
  }

  function drawFrameAfterResize() {
    // 布局重算后按钮区域会在下一帧重建，这里不执行额外绘制。
  }

  let lastFrameTime = 0;
  function loop(ms) {
    const now = ms / 1000;
    let dt = lastFrameTime ? Math.min(0.05, now - lastFrameTime) : 0.016;
    if (!(dt > 0)) dt = 0.016;
    lastFrameTime = now;
    update(dt, now);
    render(now);
    requestAnimationFrame(loop);
  }

  function init() {
    initSprites();
    resizeCanvas();
    setupResize();
    setupInput();
    // 关闭或刷新页面时也保存最高纪录
    window.addEventListener('beforeunload', saveHighScore);
    window.addEventListener('pagehide', saveHighScore);
    requestAnimationFrame(loop);
  }

  init();
})();
</script>
</body>
