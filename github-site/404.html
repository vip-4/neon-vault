<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<title>404 — NEON ARCADE</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:radial-gradient(120% 120% at 50% -10%, #11163a 0%, #05060f 60%);color:#e8f3ff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .c{max-width:420px;}
  .code{font-size:72px;font-weight:900;background:linear-gradient(90deg,#3df0ff,#ff4df0);-webkit-background-clip:text;background-clip:text;color:transparent;}
  a{display:inline-block;margin-top:18px;padding:12px 28px;border-radius:12px;text-decoration:none;font-weight:800;color:#04121a;
    background:linear-gradient(90deg,#3df0ff,#8af6ff);box-shadow:0 8px 30px rgba(61,240,255,.4);}
</style>
</head>
<body>
  <div class="c">
    <div class="code">404</div>
    <p>这一页似乎掉进了霓虹虚空。返回街机大厅继续游玩吧。</p>
    <a href="./">返回 NEON ARCADE</a>
  </div>
  <script>
  // 兼容无扩展名或带杂字符（引号/空格/反斜杠/控制字符等）的链接，自动修正后跳转到对应 .html 页面
  (function(){
    var raw = decodeURIComponent(location.pathname).replace(/\/+$/, '');
    var out = '';
    for (var i = 0; i < raw.length; i++) {
      var c = raw.charAt(i);
      var code = raw.charCodeAt(i);
      if (c === '"' || c === "'" || c === '<' || c === '>' || c === '\\' || c === ' ') continue;
      if (code < 32 || code === 127) continue;
      out += c;
    }
    var name = out.split('/').pop();
    var games = ['neon-vault','neon-void','flappy-neon','memory-neon'];
    if (games.indexOf(name) !== -1) { location.replace(out + '.html'); }
  })();
  </script>
</body>
</html>
