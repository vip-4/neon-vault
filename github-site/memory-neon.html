<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:radial-gradient(120% 120% at 50% -10%, #11163a 0%, #05060f 60%); }
  body{
    display:flex; align-items:center; justify-content:center; padding:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#e8f3ff; user-select:none; -webkit-user-select:none;
  }
  #app{
    width:min(460px,100%); border-radius:22px; padding:18px;
    background:linear-gradient(180deg,#0a1330 0%,#0a0f2e 60%,#05060f 100%);
    box-shadow:0 0 0 1px rgba(61,240,255,.18), 0 18px 60px rgba(0,0,0,.6), inset 0 0 60px rgba(61,240,255,.06);
  }
  .logo{
    text-align:center; font-size:clamp(22px,6vw,30px); font-weight:900; letter-spacing:2px; margin-bottom:14px;
    background:linear-gradient(90deg,#3df0ff,#ff4df0); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .topbar{ display:flex; gap:10px; align-items:stretch; margin-bottom:16px; }
  .stat{
    flex:1; text-align:center; padding:10px 6px; border-radius:14px;
    background:rgba(8,14,40,.55); border:1px solid rgba(61,240,255,.3);
  }
  .stat .t{ font-size:11px; opacity:.7; letter-spacing:1px; }
  .stat .n{ font-size:22px; font-weight:800; color:#3df0ff; }
  .btn{
    cursor:pointer; border:none; font-size:14px; font-weight:800; letter-spacing:1px;
    padding:0 18px; border-radius:14px; color:#04121a;
    background:linear-gradient(90deg,#3df0ff,#8af6ff);
    box-shadow:0 6px 20px rgba(61,240,255,.35);
    transition:transform .08s ease;
  }
  .btn:active{ transform:translateY(2px) scale(.98); }

  .grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
  }
  .card{ perspective:800px; aspect-ratio:1/1; cursor:pointer; }
  .card-inner{
    position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner, .card.matched .card-inner{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    border-radius:14px; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    font-size:clamp(26px,8vw,40px);
  }
  .front{
    background:linear-gradient(145deg,#0e1c4a,#13245e);
    border:1px solid rgba(61,240,255,.35);
    box-shadow:inset 0 0 18px rgba(61,240,255,.15);
  }
  .front::after{ content:"?"; color:rgba(61,240,255,.55); font-weight:900; }
  .back{
    transform:rotateY(180deg);
    background:linear-gradient(145deg,#2a1140,#3a1550);
    border:1px solid rgba(255,77,240,.45);
    box-shadow:inset 0 0 18px rgba(255,77,240,.2);
  }
  .card.matched .back{
    background:linear-gradient(145deg,#0c3a2e,#0f5240);
    border:1px solid rgba(57,240,192,.6);
    box-shadow:0 0 18px rgba(57,240,192,.4);
  }

  /* 胜利弹窗 */
  .modal{
    position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;
    background:rgba(5,6,15,.78); backdrop-filter:blur(4px); padding:20px;
  }
  .modal.hidden{ display:none; }
  .panel{
    width:min(360px,100%); text-align:center; padding:26px; border-radius:20px;
    background:linear-gradient(180deg,#0a1330,#0a0f2e);
    box-shadow:0 0 0 1px rgba(61,240,255,.25), 0 20px 60px rgba(0,0,0,.6);
  }
  .panel h2{
    margin:0 0 6px; font-size:28px; font-weight:900;
    background:linear-gradient(90deg,#3df0ff,#ff4df0); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .panel .res{ font-size:15px; opacity:.9; margin:10px 0 18px; line-height:1.7; }
  .panel .res b{ color:#3df0ff; }
</style>

<body>
<div id="app">
  <div class="logo">NEON MEMORY · 霓虹翻牌记忆</div>
  <div class="topbar">
    <div class="stat"><div class="t">步数 STEPS</div><div class="n" id="steps">0</div></div>
    <div class="stat"><div class="t">计时 TIMER</div><div class="n" id="timer">00:00</div></div>
    <button class="btn" id="resetBtn">重新洗牌</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal hidden" id="winModal">
  <div class="panel">
    <h2>通关胜利！</h2>
    <div class="res">
      你用 <b id="winSteps">0</b> 步、<b id="winTime">00:00</b> 完成了全部配对。<br>
      历史最佳：<b id="winBest">—</b>
    </div>
    <button class="btn" id="againBtn">再来一局</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const EMOJIS = ["🍎","🍌","🍇","🍉","🍓","🍒","🥝","🍑"];
  const grid = document.getElementById('grid');
  const stepsEl = document.getElementById('steps');
  const timerEl = document.getElementById('timer');
  const winModal = document.getElementById('winModal');

  let firstCard = null, secondCard = null, lock = false;
  let steps = 0, matched = 0, pairs = EMOJIS.length;
  let timerId = null, startTime = 0, elapsed = 0, timerRunning = false;
  const BEST_KEY = 'neonMemoryBest';
  let best = localStorage.getItem(BEST_KEY) || null;

  function fmt(sec){
    const m = Math.floor(sec/60), s = sec % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function shuffle(arr){
    for (let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function buildBoard(){
    grid.innerHTML = '';
    const deck = shuffle(EMOJIS.concat(EMOJIS));
    deck.forEach(function(sym){
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.sym = sym;
      card.innerHTML =
        '<div class="card-inner">' +
          '<div class="face front"></div>' +
          '<div class="face back">' + sym + '</div>' +
        '</div>';
      card.addEventListener('click', function(){ onCardClick(card); });
      grid.appendChild(card);
    });
  }

  function startTimer(){
    if (timerRunning) return;
    timerRunning = true;
    startTime = Date.now() - elapsed*1000;
    timerId = setInterval(function(){
      elapsed = Math.floor((Date.now() - startTime)/1000);
      timerEl.textContent = fmt(elapsed);
    }, 250);
  }

  function stopTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } timerRunning = false; }

  function onCardClick(card){
    if (lock) return;
    if (card.classList.contains('matched') || card.classList.contains('flipped')) return;
    if (card === firstCard) return;

    startTimer();
    card.classList.add('flipped');

    if (!firstCard){ firstCard = card; return; }

    secondCard = card;
    steps += 1;
    stepsEl.textContent = steps;
    lock = true;

    const a = firstCard.dataset.sym, b = secondCard.dataset.sym;
    if (a === b){
      // 匹配成功
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');
      firstCard = null; secondCard = null; lock = false;
      matched += 1;
      if (matched === pairs) winGame();
    } else {
      // 不匹配，0.8 秒后翻回
      setTimeout(function(){
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        firstCard = null; secondCard = null; lock = false;
      }, 800);
    }
  }

  function reset(){
    stopTimer();
    firstCard = null; secondCard = null; lock = false;
    steps = 0; matched = 0; elapsed = 0;
    stepsEl.textContent = '0';
    timerEl.textContent = '00:00';
    winModal.classList.add('hidden');
    buildBoard();
  }

  function winGame(){
    stopTimer();
    if (best === null || steps < parseInt(best,10)){
      best = String(steps);
      localStorage.setItem(BEST_KEY, best);
    }
    document.getElementById('winSteps').textContent = steps;
    document.getElementById('winTime').textContent = fmt(elapsed);
    document.getElementById('winBest').textContent = best === null ? '—' : (best + ' 步');
    setTimeout(function(){ winModal.classList.remove('hidden'); }, 350);
  }

  document.getElementById('resetBtn').addEventListener('click', reset);
  document.getElementById('againBtn').addEventListener('click', reset);

  reset();
})();
</script>
